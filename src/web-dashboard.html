<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-jev</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0a0c0b;
  --surface: #151817;
  --paper:   #f0eee9;
  --ink:     #1a1d1c;
  --clay:    #d4a373;
  --sage:    #8ca391;
  --shell:   64px;
  --line:    rgba(255, 255, 255, 0.05);
}
@media (max-width: 1100px) { :root { --shell: 40px; } }
@media (max-width: 680px)  { :root { --shell: 20px; } }

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--bg);
  color: var(--paper);
  font-family: Inter, system-ui, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(rgba(212, 163, 115, 0.08) 1px, transparent 1px);
  background-size: 34px 34px;
}

/* Film grain, fixed over everything. */
.grain {
  position: fixed; inset: 0; z-index: 1; opacity: 0.04; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

h1, h2, h3, p { margin: 0; }
a { color: var(--clay); text-decoration: none; }

.eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: 0.28em;
  text-transform: uppercase; color: rgba(140, 163, 145, 0.7);
}
.hand { font-family: Caveat, cursive; color: var(--clay); font-weight: 700; }
.serif { font-family: Newsreader, serif; }
.num { font-family: Newsreader, serif; font-weight: 700; letter-spacing: -0.035em; line-height: 1; }

/* ── Shell ── */
.wrap { position: relative; z-index: 2; max-width: 1480px; margin: 0 auto; padding: 0 var(--shell) 96px; }

header {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 32px; flex-wrap: wrap; padding: 56px 0 40px;
}
header h1 {
  font-family: Newsreader, serif; font-weight: 700; color: #fff;
  font-size: clamp(38px, 5vw, 66px); line-height: 0.9; letter-spacing: -0.045em;
}
header .hand { font-size: 26px; display: block; margin-bottom: 6px; }
.status { display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(240,238,233,0.4); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); box-shadow: 0 0 12px var(--sage); }
.dot.stale { background: #b4553f; box-shadow: none; }

/* ── Layout ── */
.columns { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 40px; align-items: start; }
@media (max-width: 1180px) { .columns { grid-template-columns: minmax(0, 1fr); } }

section { margin-bottom: 44px; }
.section-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.section-head h2 {
  font-family: Newsreader, serif; font-weight: 700; color: #fff;
  font-size: clamp(26px, 3vw, 36px); line-height: 1; letter-spacing: -0.035em;
}

/* ── Cards ── */
.card {
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 40px 70px -30px rgba(0, 0, 0, 0.7);
  padding: 30px 30px 28px;
}
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
@media (max-width: 860px) { .summary { grid-template-columns: 1fr; } }
.summary .card:nth-child(1) { border-radius: 76px 24px 76px 24px; transform: rotate(-1.1deg); }
.summary .card:nth-child(2) { border-radius: 24px 76px 24px 76px; transform: rotate(0.8deg); margin-top: 20px; }
.summary .card:nth-child(3) { border-radius: 76px 76px 24px 76px; transform: rotate(-0.5deg); }
@media (max-width: 860px) { .summary .card { transform: none !important; margin-top: 0 !important; } }

.summary .kicker { color: rgba(140,163,145,0.7); margin-bottom: 12px; }
.summary .value { font-size: clamp(34px, 4vw, 52px); color: #fff; }
.summary .value.saved { color: var(--clay); }
.summary .detail { font-size: 13px; color: rgba(240,238,233,0.42); margin-top: 10px; }

.panel { border-radius: 48px 20px 48px 20px; }
.panel.alt { border-radius: 20px 48px 20px 48px; }

/* ── Bars ── */
.row { display: grid; grid-template-columns: 96px 1fr auto; gap: 16px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(240,238,233,0.45); }
.track { height: 7px; border-radius: 100px; background: rgba(255,255,255,0.05); overflow: hidden; }
.fill { height: 100%; border-radius: 100px; background: var(--clay); transition: width 0.5s ease; }
.fill.sage { background: var(--sage); }
.fill.hot { background: #b4553f; }
.row .amt { font-size: 13px; color: rgba(240,238,233,0.75); white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .amt b { color: var(--clay); font-weight: 700; }

/* ── Tiers ── */
.tiers { display: grid; gap: 14px; }
.tier-row { display: grid; grid-template-columns: 90px 1fr auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.tier-row:last-child { border-bottom: 0; }
.badge {
  display: inline-block; padding: 5px 13px; border-radius: 100px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
}
.badge.haiku  { background: rgba(140,163,145,0.16); color: var(--sage); }
.badge.sonnet { background: rgba(212,163,115,0.16); color: var(--clay); }
.badge.opus   { background: rgba(180,85,63,0.18);  color: #d98b72; }
.badge.unknown{ background: rgba(255,255,255,0.07); color: rgba(240,238,233,0.5); }
.tier-row .meta { font-size: 12.5px; color: rgba(240,238,233,0.42); }
.tier-row .money { text-align: right; font-size: 13px; color: rgba(240,238,233,0.75); font-variant-numeric: tabular-nums; }
.tier-row .money b { display: block; color: var(--clay); font-family: Newsreader, serif; font-size: 19px; }

/* ── Table ── */
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
  text-transform: uppercase; color: rgba(240,238,233,0.3);
  padding: 0 0 12px; border-bottom: 1px solid var(--line);
}
td { padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 13px; color: rgba(240,238,233,0.68); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td.right, th.right { text-align: right; }
.empty { padding: 40px 0; text-align: center; color: rgba(240,238,233,0.3); font-size: 14px; }
.empty .serif { display: block; font-size: 22px; color: rgba(240,238,233,0.5); margin-bottom: 6px; }

/* ── Chat ── */
.chat { position: sticky; top: 28px; display: flex; flex-direction: column; border-radius: 56px 20px 56px 20px; padding: 0; overflow: hidden; max-height: calc(100vh - 56px); }
@media (max-width: 1180px) { .chat { position: static; max-height: 720px; } }
.chat-head { padding: 26px 30px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.chat-head h3 { font-family: Newsreader, serif; font-weight: 600; font-size: 23px; color: var(--paper); }
.chat-head .hand { font-size: 17px; }
.icon-btn { background: none; border: 0; color: rgba(240,238,233,0.3); cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; font-family: inherit; padding: 6px; }
.icon-btn:hover { color: var(--clay); }

.log { flex: 1; overflow-y: auto; padding: 22px 30px; display: flex; flex-direction: column; gap: 18px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.12) transparent; }
.log::-webkit-scrollbar { width: 7px; }
.log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 100px; }

.msg { display: flex; flex-direction: column; gap: 7px; max-width: 92%; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg .who { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(240,238,233,0.28); }
.bubble { padding: 13px 17px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me .bubble { background: var(--clay); color: var(--ink); border-radius: 20px 20px 4px 20px; font-weight: 500; }
.msg.bot .bubble { background: rgba(255,255,255,0.04); border: 1px solid var(--line); color: rgba(240,238,233,0.88); border-radius: 20px 20px 20px 4px; }
.msg.bot .bubble.err { border-color: rgba(180,85,63,0.4); color: #d98b72; }
.routed { display: flex; align-items: center; gap: 8px; font-size: 11px; color: rgba(240,238,233,0.3); flex-wrap: wrap; }
.tool { font-size: 11px; color: var(--sage); opacity: 0.75; }
.tool::before { content: "99 "; }
.backend { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(240,238,233,0.3); }
.caret::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--clay); }
@keyframes blink { 50% { opacity: 0; } }

.composer { border-top: 1px solid var(--line); padding: 16px 20px 18px 30px; display: flex; gap: 12px; align-items: flex-end; }
textarea {
  flex: 1; background: none; border: 0; resize: none; color: var(--paper);
  font-family: inherit; font-size: 14px; line-height: 1.55; max-height: 160px; padding: 9px 0;
}
textarea:focus { outline: none; }
textarea::placeholder { color: rgba(240,238,233,0.25); }
.send {
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 100px; padding: 13px 22px; cursor: pointer;
  background: var(--clay); color: var(--ink);
  font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase;
  transition: background 0.15s ease, transform 0.15s ease;
}
.send:hover:not(:disabled) { background: #fff; transform: scale(1.03); }
.send:active:not(:disabled) { transform: scale(0.97); }
.send:disabled { opacity: 0.35; cursor: not-allowed; }
.notice { padding: 20px 30px; font-size: 13px; line-height: 1.6; color: rgba(240,238,233,0.45); border-top: 1px solid var(--line); }
.notice code { color: var(--clay); font-size: 12px; }

footer { padding-top: 12px; font-size: 12px; color: rgba(240,238,233,0.22); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">

  <header>
    <div>
      <span class="hand">routing, quietly</span>
      <h1>claude&#8209;jev</h1>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">connecting</span></div>
  </header>

  <div class="columns">
    <div>
      <section>
        <div class="summary">
          <div class="card">
            <p class="eyebrow kicker">You saved</p>
            <p class="num value saved" id="saved">$0.00</p>
            <p class="detail" id="savedPct">&mdash;</p>
          </div>
          <div class="card">
            <p class="eyebrow kicker">Actual spend</p>
            <p class="num value" id="spend">$0.00</p>
            <p class="detail" id="spendDetail">&mdash;</p>
          </div>
          <div class="card">
            <p class="eyebrow kicker">Baseline would be</p>
            <p class="num value" id="base">$0.00</p>
            <p class="detail" id="baseDetail">&mdash;</p>
          </div>
        </div>
      </section>

      <section id="capsSection">
        <div class="section-head"><h2>Usage caps</h2><span class="eyebrow">subscription</span></div>
        <div class="card panel" id="caps"></div>
      </section>

      <section>
        <div class="section-head"><h2>Savings over time</h2></div>
        <div class="card panel alt" id="windows"></div>
      </section>

      <section>
        <div class="section-head"><h2>Where the work went</h2><span class="eyebrow">by tier</span></div>
        <div class="card panel"><div class="tiers" id="tiers"></div></div>
      </section>

      <section>
        <div class="section-head"><h2>Recent</h2><span class="eyebrow">last 15</span></div>
        <div class="card panel alt" id="recent"></div>
      </section>
    </div>

    <aside>
      <div class="card chat">
        <div class="chat-head">
          <div>
            <span class="hand">talk to it</span>
            <h3>Chat</h3>
            <span class="backend" id="backend"></span>
          </div>
          <button class="icon-btn" id="clear" title="Clear conversation">Clear</button>
        </div>
        <div class="log" id="log"></div>
        <div id="composerWrap">
          <div class="composer">
            <textarea id="input" rows="1" placeholder="Ask something&hellip;"></textarea>
            <button class="send" id="send">Send</button>
          </div>
        </div>
        <div class="notice" id="chatNotice" hidden></div>
      </div>
    </aside>
  </div>

  <footer>
    <span>Every turn priced against <span id="baselineName">the baseline model</span>.</span>
    <span id="updated"></span>
  </footer>
</div>

<script>
const TOKEN = "__JEV_TOKEN__";
const api = (p) => p + (p.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN);

const $ = (id) => document.getElementById(id);
const money = (n) => "$" + (Number(n) || 0).toFixed(2);
const tokens = (n) => {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
};
const pct = (part, whole) => (whole > 0 ? (part / whole) * 100 : 0);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tierClass = (t) => (["haiku", "sonnet", "opus"].includes(t) ? t : "unknown");

// ── Metrics ────────────────────────────────────────────────────────────────
let chatReady = false;

async function refresh() {
  let data;
  try {
    const r = await fetch(api("/api/savings"));
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch {
    $("dot").classList.add("stale");
    $("status").textContent = "disconnected";
    return;
  }
  $("dot").classList.remove("stale");
  $("status").textContent = "live";
  $("updated").textContent = "updated " + new Date().toLocaleTimeString();

  if (data.chatReady !== chatReady) { chatReady = data.chatReady; paintChatState(); }
  if (data.backend && !$("backend").textContent) {
    $("backend").textContent = data.backend === "agent" ? "via claude code" : "via api";
  }

  const { month, today, week, byTier } = data.aggregated;
  const saved = month.baselineCost - month.cost;

  $("saved").textContent = money(saved);
  $("savedPct").textContent = pct(saved, month.baselineCost).toFixed(1) + "% less, 30 days";
  $("spend").textContent = money(month.cost);
  $("spendDetail").textContent =
    tokens(month.inputTokens + month.outputTokens) + " tokens · " + month.requests + " requests";
  $("base").textContent = money(month.baselineCost);
  $("baseDetail").textContent =
    tokens(month.inputTokens) + " in · " + tokens(month.outputTokens) + " out";

  paintWindows({ Today: today, "7 days": week, "30 days": month });
  paintCaps(data.usage);
  paintTiers(byTier);
  paintRecent(data.events);
}

function paintWindows(buckets) {
  $("windows").innerHTML = Object.entries(buckets).map(([name, b]) => {
    const saved = b.baselineCost - b.cost;
    const p = pct(saved, b.baselineCost);
    return `<div class="row">
      <span class="label">${esc(name)}</span>
      <span class="track"><span class="fill" style="width:${Math.max(0, Math.min(100, p)).toFixed(1)}%"></span></span>
      <span class="amt"><b>${money(saved)}</b> saved &middot; ${p.toFixed(0)}% &middot; ${b.requests} req</span>
    </div>`;
  }).join("");
}

function paintCaps(usage) {
  const rows = [["5-hour", usage?.fiveHour], ["Weekly", usage?.sevenDay]]
    .filter(([, v]) => v && v.utilization != null);
  if (!rows.length) {
    // Do not hide the section: a missing gauge with no explanation reads as a
    // bug. Utilization is in-memory and only lands once a response comes back
    // through the proxy, so it is empty until the first request of a session.
    $("caps").innerHTML =
      `<p class="empty"><span class="serif">No usage data yet.</span>` +
      `Caps appear after the first request of a session, and need a Pro/Max login &mdash; ` +
      `an API key has no unified caps. Chat counts too.</p>`;
    return;
  }
  $("caps").innerHTML = rows.map(([name, v]) => {
    const p = Math.max(0, Math.min(100, v.utilization * 100));
    const cls = p >= 85 ? "hot" : p >= 60 ? "" : "sage";
    const reset = v.resetAt ? "resets " + new Date(v.resetAt * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
    return `<div class="row">
      <span class="label">${esc(name)}</span>
      <span class="track"><span class="fill ${cls}" style="width:${p.toFixed(1)}%"></span></span>
      <span class="amt">${p.toFixed(0)}% &middot; ${esc(reset)}</span>
    </div>`;
  }).join("");
}

function paintTiers(byTier) {
  const names = ["haiku", "sonnet", "opus", ...Object.keys(byTier || {}).filter((t) => !["haiku", "sonnet", "opus"].includes(t))];
  const rows = names.filter((t) => byTier && byTier[t]).map((t) => {
    const b = byTier[t];
    const saved = b.baselineCost - b.cost;
    return `<div class="tier-row">
      <span><span class="badge ${tierClass(t)}">${esc(t)}</span></span>
      <span class="meta">${b.requests} request${b.requests === 1 ? "" : "s"} &middot; ${tokens(b.inputTokens + b.outputTokens)} tokens</span>
      <span class="money"><b>${money(saved)}</b>actual ${money(b.cost)}</span>
    </div>`;
  });
  $("tiers").innerHTML = rows.length ? rows.join("")
    : `<p class="empty"><span class="serif">Nothing routed yet.</span>Start a session and this fills in.</p>`;
}

function paintRecent(events) {
  const rows = (events || []).slice(-15).reverse();
  if (!rows.length) {
    $("recent").innerHTML = `<p class="empty"><span class="serif">No requests recorded.</span>The ledger is empty.</p>`;
    return;
  }
  $("recent").innerHTML = `<table><thead><tr>
      <th>When</th><th>Tier</th><th class="right">Tokens</th>
      <th class="right">Actual</th><th class="right">Saved</th>
    </tr></thead><tbody>` +
    rows.map((e) => {
      const saved = (e.baselineCost || 0) - (e.cost || 0);
      const cached = e.cacheReadTokens ? ` <span style="opacity:.45">(${tokens(e.cacheReadTokens)} cached)</span>` : "";
      return `<tr>
        <td>${new Date(e.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</td>
        <td><span class="badge ${tierClass(e.tier)}">${esc(e.tier || "?")}</span></td>
        <td class="right">${tokens((e.inputTokens || 0) + (e.outputTokens || 0))}${cached}</td>
        <td class="right">${money(e.cost)}</td>
        <td class="right" style="color:var(--clay)">${money(saved)}</td>
      </tr>`;
    }).join("") + "</tbody></table>";
}

// ── Chat ───────────────────────────────────────────────────────────────────
const chatId = "dash-" + Math.random().toString(36).slice(2, 10);
let streaming = false;

function paintChatState() {
  $("composerWrap").hidden = !chatReady;
  $("chatNotice").hidden = chatReady;
  if (!chatReady) {
    $("chatNotice").innerHTML =
      "Chat is off. It runs headless Claude Code, so it works on a Pro/Max subscription with no " +
      "API key &mdash; but it needs <code>claude</code> on PATH and a live proxy, which " +
      "<code>claude-jev dashboard</code> does not start. Launch <code>claude-jev</code> instead, " +
      "or set <code>ANTHROPIC_API_KEY</code> to use the direct API path.";
  }
}

function bubble(role, text, cls) {
  const el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "me" : "bot");
  el.innerHTML = `<span class="who">${role === "user" ? "you" : "claude"}</span>` +
    `<div class="bubble ${cls || ""}"></div>`;
  el.querySelector(".bubble").textContent = text;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

function setStreaming(on) {
  streaming = on;
  $("send").disabled = on;
  $("send").textContent = on ? "···" : "Send";
}

async function send() {
  const text = $("input").value.trim();
  if (!text || streaming || !chatReady) return;
  $("input").value = "";
  $("input").style.height = "auto";
  bubble("user", text);
  setStreaming(true);

  const holder = bubble("assistant", "");
  const body = holder.querySelector(".bubble");
  body.classList.add("caret");
  let routed = null;

  try {
    const res = await fetch(api("/api/chat"), {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Jev-Token": TOKEN },
      body: JSON.stringify({ id: chatId, text }),
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.error || ("HTTP " + res.status));
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split("\n\n");
      buf = frames.pop() || "";
      for (const frame of frames) {
        const ev = /^event: (.+)$/m.exec(frame);
        const dl = /^data: (.+)$/m.exec(frame);
        if (!ev || !dl) continue;
        const data = JSON.parse(dl[1]);
        if (ev[1] === "backend") {
          $("backend").textContent = data.backend === "agent" ? "via claude code" : "via api";
        } else if (ev[1] === "tool") {
          const tip = document.createElement("div");
          tip.className = "tool";
          tip.textContent = data.name;
          holder.insertBefore(tip, body);
        } else if (ev[1] === "routed") {
          routed = data;
          const badge = document.createElement("div");
          badge.className = "routed";
          const conf = data.confidence != null ? " · p=" + data.confidence.toFixed(2) : "";
          badge.innerHTML = `<span class="badge ${tierClass(data.tier)}">${esc(data.tier)}</span>` +
            `<span>${esc(data.model)}${conf}</span>`;
          holder.insertBefore(badge, body);
        } else if (ev[1] === "delta") {
          body.textContent += data.text;
          $("log").scrollTop = $("log").scrollHeight;
        } else if (ev[1] === "failed") {
          body.classList.add("err");
          body.textContent = data.error;
        }
      }
    }
    if (!body.textContent && !body.classList.contains("err")) {
      body.classList.add("err");
      body.textContent = "No reply received.";
    }
  } catch (err) {
    body.classList.add("err");
    body.textContent = err.message;
  } finally {
    body.classList.remove("caret");
    setStreaming(false);
    refresh();          // the turn just cost money — show it
  }
}

$("send").addEventListener("click", send);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(160, e.target.scrollHeight) + "px";
});
$("clear").addEventListener("click", async () => {
  if (streaming) return;
  $("log").innerHTML = "";
  await fetch(api("/api/chat/reset"), {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Jev-Token": TOKEN },
    body: JSON.stringify({ id: chatId }),
  }).catch(() => {});
});

paintChatState();
refresh();
setInterval(refresh, 5000);
</script>
</body>
